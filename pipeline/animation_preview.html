<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<style>/* All CSS is already embedded in the HTML head. No separate CSS file needed. */</style></head>
<body><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>htmlMC — Step 4 Integration Animation</title>
  <!-- Load Space Grotesk from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 800px;
      height: 450px;
      background: transparent;
      overflow: hidden;
      font-family: 'Space Grotesk', sans-serif;
    }

    #stage {
      position: relative;
      width: 800px;
      height: 450px;
      background: transparent;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* Outer dashed rotating ring */
    .ring {
      position: absolute;
      width: 280px;
      height: 280px;
      border: 3px dashed rgba(168, 85, 247, 0.4);
      border-radius: 50%;
      animation: rotateRing 5s linear infinite;
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.1);
    }

    /* Central radial glowing pulse */
    .glow-core {
      position: absolute;
      width: 120px;
      height: 120px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.3) 0%, rgba(139, 92, 246, 0) 70%);
      border-radius: 50%;
      pointer-events: none;
      animation: pulseGlow 2.5s ease-in-out infinite alternate;
    }

    /* The new spinning blue square */
    .blue-square {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 80px;
      height: 80px;
      background-color: #2563eb;
      box-shadow: 0 0 20px rgba(37, 99, 235, 0.5);
      z-index: 20;
      animation: spinSquare 4s linear forwards;
      /* Start centered and ready to rotate */
      transform: translate(-50%, -50%) rotate(0deg);
    }

    /* Typography logo text card */
    .logo-container {
      z-index: 10;
      text-align: center;
      animation: zoomIn 5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    .title {
      font-size: 2.2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #c084fc 0%, #6366f1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
      letter-spacing: -0.05em;
    }

    .subtitle {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.55);
      margin-top: 4px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    /* SVG Layer for animated vector graphics */
    .vector-layer {
      position: absolute;
      width: 800px;
      height: 450px;
      pointer-events: none;
      z-index: 5;
    }

    /* SVG polygon animation */
    .hexagon {
      transform-origin: 400px 225px;
      animation: spinHexagon 5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    /* --- Keyframe Animations (Driven by WAAPI pauses) --- */
    @keyframes rotateRing {
      0% {
        transform: rotate(0deg) scale(0.9);
        opacity: 0.2;
      }
      50% {
        opacity: 0.8;
      }
      100% {
        transform: rotate(360deg) scale(1.05);
        opacity: 0.2;
      }
    }

    @keyframes pulseGlow {
      0% {
        transform: scale(0.8);
        opacity: 0.4;
      }
      100% {
        transform: scale(1.4);
        opacity: 0.95;
      }
    }

    @keyframes zoomIn {
      0% {
        transform: scale(0.7);
        opacity: 0.05;
      }
      30% {
        transform: scale(1);
        opacity: 1;
      }
      80% {
        transform: scale(1);
        opacity: 1;
      }
      100% {
        transform: scale(1.08);
        opacity: 0;
      }
    }

    @keyframes spinHexagon {
      0% {
        transform: rotate(0deg) scale(0.6);
        stroke-dashoffset: 400;
        opacity: 0.1;
      }
      40% {
        stroke-dashoffset: 0;
        opacity: 0.7;
      }
      80% {
        transform: rotate(180deg) scale(1.1);
        opacity: 0.7;
      }
      100% {
        transform: rotate(240deg) scale(1.3);
        opacity: 0;
      }
    }

    /* Spin the blue square */
    @keyframes spinSquare {
      0% {
        transform: translate(-50%, -50%) rotate(0deg);
      }
      100% {
        transform: translate(-50%, -50%) rotate(360deg);
      }
    }
  </style>
</head>
<body>

  <div id="stage">
    <!-- Outer dashed rotating ring -->
    <div class="ring"></div>
    
    <!-- Central radial glowing pulse -->
    <div class="glow-core"></div>

    <!-- Spinning blue square (added) -->
    <div class="blue-square"></div>

    <!-- Inline animated vector SVG -->
    <svg class="vector-layer" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Polygon points forming a hexagon centered at 400,225 -->
      <polygon class="hexagon" points="400,125 487,175 487,275 400,325 313,275 313,175" stroke="url(#svg-gradient)" stroke-width="3" stroke-dasharray="400" stroke-dashoffset="0" fill="rgba(168, 85, 247, 0.03)"></polygon>
      
      <!-- Linear gradient definition for premium vector feel -->
      <defs>
        <linearGradient id="svg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ec4899"></stop>
          <stop offset="100%" stop-color="#8b5cf6"></stop>
        </linearGradient>
      </defs>
    </svg>

    <!-- Typography Card -->
    <div class="logo-container">
      <div class="title">htmlMC ENGINE</div>
      <div class="subtitle">Step 4 Pipeline Integration</div>
    </div>
  </div>

  <script>
    window.addEventListener('message', (e) => {
      if (e.data && e.data.type === 'seek') {
        const t = e.data.timeMs;
        document.getAnimations().forEach(a => {
          a.currentTime = t;
          a.pause();
        });
      }
    });
  </script>



</body></html>
<script>/* All JavaScript is already embedded in the HTML body. No separate JS file needed. */
window.addEventListener('message',(e)=>{
  if(e.data?.type==='seek'){const t=e.data.timeMs;document.getAnimations().forEach(a=>{a.currentTime=t;a.pause();});}
  if(e.data?.type==='error_report'){window.parent.postMessage({type:'error',message:e.data.message},'*');}
});</script></body></html>
